<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI App Builder</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f7fa; padding: 20px; }
  h1 { text-align: center; color: #333; }
  #appBuilder { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
  textarea { width: 100%; height: 100px; border-radius: 8px; border: 1px solid #ccc; padding: 10px; font-size: 16px; resize: none; }
  button { background: #4CAF50; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
  button:hover { background: #45a049; }
  #output { margin-top: 20px; background: #f0f4f8; padding: 20px; border-radius: 12px; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>AI App Builder</h1>

<div id="appBuilder">
  <label for="appIdea">Describe your app:</label>
  <textarea id="appIdea" placeholder="E.g., Build a 3D modeling marketplace with AI previews and subscriptions..."></textarea>
  <button onclick="generateBlueprint()">Generate App Blueprint</button>

  <div id="output">Your app blueprint will appear here.</div>
</div>

<script>
async function generateBlueprint() {
  const idea = document.getElementById('appIdea').value.trim();
  const output = document.getElementById('output');

  if (!idea) {
    alert('Please enter your app idea.');
    return;
  }

  output.textContent = 'Generating blueprint, please wait...';

  try {
    // Call your backend API which proxies the OpenAI request
    const response = await fetch('https://your-backend.com/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: idea })
    });

    const data = await response.json();
    output.textContent = data.result || 'No blueprint generated.';
  } catch (err) {
    output.textContent = 'Error generating blueprint: ' + err.message;
  }
}
</script>

</body>
</html>
